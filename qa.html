<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q&amp;A Videos | NextGen Desk</title>
  <meta name="description" content="Quick Q&amp;A videos for NextGen Desk: fixes and how-tos for the questions clients ask most.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="course.css">
</head>
<body>

<div class="page">
  <div class="glow glow--1" aria-hidden="true"></div>
  <div class="glow glow--2" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container">
      <nav class="nav" aria-label="Main">
        <a href="index.html" class="brand" aria-label="NextGen Desk home">
          <img class="brand__logo" src="assets/nextgen-desk-logo-sm.png" alt="" width="109" height="56">
          <span class="brand__name">NextGen <span class="brand__accent">Desk</span></span>
        </a>
        <span class="nav__course">Q&amp;A Videos</span>
        <a href="course.html" class="nav__link">Course</a>
        <a href="index.html" class="nav__link nav__back">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
          Back to home
        </a>
      </nav>
    </div>
  </header>

  <main class="container learn">

    <!-- Player column -->
    <section class="learn__main" aria-labelledby="lessonTitle">
      <div class="player glass">
        <div class="player__frame" id="playerFrame" oncontextmenu="return false;">
          <!-- video iframe or placeholder goes here -->
        </div>
      </div>

      <div class="lesson-head">
        <div class="lesson-head__text">
          <div class="lesson-head__kicker"><span id="lessonNum">Q&amp;A 1</span></div>
          <h1 id="lessonTitle" class="lesson-head__title"></h1>
          <p id="lessonDesc" class="lesson-head__desc" hidden></p>
        </div>
      </div>

      <div class="pager">
        <button type="button" id="prevBtn" class="btn btn--ghost">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
          Previous
        </button>
        <button type="button" id="nextBtn" class="btn btn--primary">
          Next video
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <!-- Lesson list -->
    <aside class="learn__side glass" aria-label="All Q&amp;A videos">
      <div class="side__head">
        <h2 class="side__title">All Q&amp;A videos</h2>
        <p class="side__note" id="qaCount"></p>
      </div>
      <ol class="lesson-list" id="qaList"></ol>
      <a class="side__course-link" href="course.html">Looking for the lessons? Go to the course</a>
    </aside>
  </main>

  <div class="container">
    <footer class="footer">
      <div class="footer__brand">
        <img class="footer__logo" src="assets/nextgen-desk-logo-sm.png" alt="" width="62" height="32">
        <span>© <span id="year">2026</span> NextGen Desk. All rights reserved.</span>
      </div>
      <div class="footer__links">
        <a href="index.html">Home</a>
        <a href="course.html">Course</a>
        <a href="mailto:nextgendeskai@gmail.com">Support</a>
      </div>
    </footer>
  </div>
</div>

<script src="course-data.js"></script>
<script src="qa.js"></script>
<!-- GoHighLevel chat widget -->
<script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6ab671c58615594d9ab5c466"></script>
</body>
</html>
